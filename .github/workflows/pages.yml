# Публикует папку site/ на GitHub Pages при каждом изменении в main.
name: Публикация сайта

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Пока сайт — черновик, просим поисковики его не индексировать.
      # Когда сайт будет готов к публикации, этот шаг нужно удалить.
      - name: Закрыть черновик от поисковиков
        run: find site -name '*.html' -exec sed -i 's|<head>|<head><meta name="robots" content="noindex">|' {} +

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
