<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Расстрелы в Москве — карта</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
html,body,#map{margin:0;height:100%;background:#0e0f11}
.leaflet-container{background:#0e0f11}
.st{position:absolute;white-space:nowrap;text-align:center;font:10px/12px system-ui,sans-serif;color:#5a5c62;letter-spacing:.08em;text-transform:uppercase}
#info{position:absolute;z-index:650;top:12px;left:56px;background:rgba(15,15,15,.85);color:#ddd;font:13px/1.4 system-ui,sans-serif;padding:10px 14px;border-radius:6px;max-width:340px}
#info b{color:#fff;font-size:15px}
#info .m{color:#999}
.leaflet-popup-content-wrapper{background:#1b1b1b;color:#ddd;border-radius:6px}
.leaflet-popup-tip{background:#1b1b1b}
.leaflet-popup-content{font:12.5px/1.45 system-ui,sans-serif;max-height:340px;overflow:auto;margin:12px 14px;width:320px!important}
.pp h3{margin:0 0 6px;color:#fff;font-size:14px}
.pp .p{border-top:1px solid #333;padding:6px 0}
.pp .n{color:#ff6b5b;font-weight:600}
.pp .m{color:#888;font-size:11.5px;margin-top:2px}
.pp h3{margin-bottom:2px}
.pp .sum{color:#bbb;margin-bottom:8px}
.pp .life{color:#bbb;white-space:nowrap}
.pp .job{color:#ddd}
.pp .other{border-top:1px solid #333;padding:8px 0 4px;color:#888;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.pp .p.dim,.pp .p.dim .n,.pp .p.dim .life,.pp .p.dim .job,.pp .p.dim .m{color:#6b6b6b}
.pp .p.dim .n{font-weight:400}
#time{position:absolute;z-index:650;left:12px;right:12px;bottom:12px;max-width:620px;font:13px/1.4 system-ui,sans-serif;color:#ddd;pointer-events:none}
#time>*{pointer-events:auto}
#time-btn{background:rgba(15,15,15,.85);color:#ddd;border:1px solid #444;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
#time-panel{background:rgba(15,15,15,.9);border-radius:6px;padding:10px 12px 6px;margin-bottom:8px}
#time-head b{color:#fff}
#time-range{display:block;width:100%;margin:12px 0 0;accent-color:#ff3b2f;cursor:pointer}
#time-range.idle{accent-color:#8a8a8a}
#time-ticks{position:relative;height:16px;margin:2px 8px 0}
#time-ticks span{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:#888}
#time-head button{margin-left:8px;background:none;border:1px solid #666;border-radius:4px;color:#ddd;font:inherit;padding:1px 8px;cursor:pointer}
</style></head><body>
<div id="map"></div>
<div id="info"><b>Расстрелы в Москве, 1921–1953</b><br><span id="cnt">Загрузка…</span><br><span id="tl" class="m"></span><br>
<span class="m">Точка — дом, размер — число расстрелянных жильцов. Клик — список людей. Источник: «Мемориал», mos.memo.ru; координаты — Д. Скугаревский.</span></div>
<div id="time"><div id="time-panel" hidden><div id="time-head"></div><input id="time-range" type="range" step="1" aria-label="Год"><div id="time-ticks"></div></div><button id="time-btn" hidden>Таймлайн</button></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="map.js"></script>
</body></html>
