<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вариант В — схема · прототип оформления</title>
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="common.css">
<style>
/* Вариант В. Строгая схема: знаком служит сам дом. Монохром и один акцент — только у выбранного дома. */
:root{--bg:#efefec;--ink:#111;--soft:#77776f;--acc:#d2451e}
body{font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#top .t{font-weight:700;font-size:17px;letter-spacing:-.01em}
#top .c{font-weight:500}
#top .l{color:var(--soft);opacity:1}
.lb.st{font:10px/12px Helvetica,Arial,sans-serif;color:#9a9a92;letter-spacing:.04em}
.lb.num{font:700 10px/13px Helvetica,Arial,sans-serif;color:#fff;background:var(--ink);padding:0 3px;min-width:13px;text-align:center;font-variant-numeric:tabular-nums}
.lb.num.sel{background:var(--acc)}
#sheet{background:#fff;border-top:3px solid var(--ink)}
#card h2{font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
#card .k{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px;line-height:1.5;margin:0 0 6px}
#card .k dt{color:var(--soft)}#card .k dd{margin:0;font-variant-numeric:tabular-nums}
#card .yrs{display:flex;align-items:flex-end;gap:3px;height:54px;margin:14px 0 4px;border-bottom:1px solid var(--ink)}
#card .yrs b{flex:1;background:var(--ink);min-width:3px}
#card .yrs b.z{background:none}
#card .ax{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
#card table{width:100%;border-collapse:collapse;margin-top:16px}
#card td{vertical-align:top;padding:9px 0 10px;border-top:1px solid #ddd;font-size:13px;line-height:1.45}
#card td.d{width:88px;padding-right:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#card .n{font-size:15px;font-weight:700;line-height:1.3}
#card .f{color:#333;font-variant-numeric:tabular-nums}
#card .bio{color:var(--soft)}
#card .note{font-size:12px;color:var(--soft);margin:10px 0 0}
#src{color:var(--soft)}
.leaflet-bar{border:1px solid var(--ink)!important;border-radius:0!important;box-shadow:none!important}
.leaflet-bar a{background:#fff;color:var(--ink);border-radius:0!important;border-color:var(--ink)}
@media (min-width:760px){#sheet{border-top:0;border-left:3px solid var(--ink)}}
</style></head><body>
<div id="map"></div>
<header id="top">
  <h1 class="t">Арбат и окрестности</h1>
  <div class="c" id="cnt">Загрузка…</div>
  <div class="l" id="leg">Чёрный дом — по этому адресу жил хотя бы один расстрелянный. Цифра — сколько их.</div>
  <nav><a href="a.html">А</a><a href="b.html">Б</a><a class="on" href="c.html">В</a></nav>
</header>
<aside id="sheet" aria-hidden="true"><button id="x" aria-label="Закрыть">×</button><div id="card"></div></aside>
<div id="src">Люди и адреса: «Мемориал», mos.memo.ru; координаты — Д. Скугаревский. Дома и улицы: © участники OpenStreetMap, современные контуры и названия.</div>
<script src="../vendor/leaflet/leaflet.js"></script>
<script src="common.js"></script>
<script>
Proto.load().then(data => {
  const { esc } = Proto, map = Proto.makeMap(data.base);
  const used = new Set(data.houses.map(h => h.b));
  const idle = i => used.has(i) ? { color: '#111', fillColor: '#111', weight: 0.5 } : { color: '#cdcdc8', fillColor: '#e3e3df', weight: 0.6 };
  const B = Proto.drawBase(map, data.base, { green: { fillColor: '#e6e8e2' }, street: { a: '#fff', b: '#fff', p: '#fff' }, building: idle });
  const lines = Proto.streetLines(data.base), lab = Proto.Labeler(map);
  // адреса, для которых на современной карте не нашлось дома: пустой квадрат 12 × 12 м
  const lost = data.houses.filter(h => h.b < 0);
  lost.forEach(h => {
    const kx = Proto.M_LAT * Math.cos(h.lat * Math.PI / 180), d = 6;
    h.sq = L.rectangle([[h.lat - d / Proto.M_LAT, h.lon - d / kx], [h.lat + d / Proto.M_LAT, h.lon + d / kx]], { color: '#111', weight: 1.4, fill: true, fillColor: '#efefec', fillOpacity: 1, interactive: false }).addTo(map);
  });
  document.getElementById('leg').textContent += ' Пустой квадрат — адрес, для которого на современной карте дом не найден (' + lost.length + ' из ' + data.houses.length + ').';
  const order = data.houses.slice().sort((a, b) => b.people.length - a.people.length);
  const NF = '700 10px Helvetica, Arial, sans-serif';
  let sel;

  function draw() {
    const z = map.getZoom(), view = map.getBounds().pad(0.35), cur = sel && sel.get();
    lab.begin();
    order.forEach(h => {
      const n = h.people.length;
      if (h !== cur && (z < 16 || (z < 17 && n < 2)) || !view.contains([h.lat, h.lon])) return;
      const p = map.latLngToLayerPoint([h.lat, h.lon]), w = Math.max(13, lab.width(String(n), NF) + 6);
      lab.add(p.x - w / 2, p.y - 6.5, w, 13, String(n), 'num' + (h === cur ? ' sel' : ''), { force: h === cur, pad: 1 });
    });
    if (z >= 16) lab.streets(lines, '10px Helvetica, Arial, sans-serif', 'st', 12);
  }
  const paint = (h, on) => {
    if (h.b >= 0) { B[h.b].setStyle(on ? { color: '#d2451e', fillColor: '#d2451e' } : idle(h.b)); if (on) B[h.b].bringToFront(); }
    else h.sq.setStyle({ color: on ? '#d2451e' : '#111' });
  };
  sel = Proto.selection({
    data, map,
    onSelect(h, prev) { if (prev) paint(prev, false); if (h) paint(h, true); draw(); },
    render(h) {
      const ppl = h.people.slice().sort((a, b) => Proto.dateKey(a.shot) - Proto.dateKey(b.shot));
      const ys = ppl.map(p => Proto.yearOf(p.shot)).filter(Boolean), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const cnt = {}; ys.forEach(y => cnt[y] = (cnt[y] || 0) + 1);
      const top = Math.max(...Object.values(cnt));
      let bars = '';
      for (let y = y0; y <= y1; y++) bars += '<b' + (cnt[y] ? ' style="height:' + Math.round(cnt[y] / top * 100) + '%" title="' + y + ': ' + cnt[y] + '"' : ' class="z"') + '></b>';
      const apts = new Set(ppl.map(p => p.apt).filter(Boolean)).size;
      const peak = Object.keys(cnt).filter(y => cnt[y] === top);
      return '<h2>' + esc(h.addr) + '</h2><dl class="k"><dt>Расстреляно</dt><dd>' + Proto.people(ppl.length) + '</dd>' +
        (apts ? '<dt>Квартир</dt><dd>' + apts + '</dd>' : '') +
        '<dt>Годы</dt><dd>' + (y0 === y1 ? y0 : y0 + '–' + y1) + '</dd></dl>' +
        (y1 > y0 ? '<div class="yrs">' + bars + '</div><div class="ax"><span>' + y0 + '</span><span>расстрелов по годам; больше всего — ' + peak.join(', ') + ' (' + top + ')</span><span>' + y1 + '</span></div>' : '') +
        (h.b < 0 ? '<p class="note">На современной карте дом по этому адресу не найден: точка адреса дальше ' + data.near + ' м от любого контура.</p>' : '') +
        '<table>' + ppl.map(p => '<tr><td class="d">' + esc(p.shot) + '</td><td><div class="n">' + esc(p.name) + '</div><div class="f">' +
          [p.born ? p.born + ' г. р.' : '', p.apt ? 'кв. ' + esc(p.apt) : '', esc(p.burial)].filter(Boolean).join(' · ') + '</div><div class="bio">' + esc(p.bio) + '</div></td></tr>').join('') + '</table>';
    },
  });
  map.on('moveend zoomend', draw);
  draw();
  Proto.header(data);
}).catch(Proto.fail);
</script>
</body></html>
